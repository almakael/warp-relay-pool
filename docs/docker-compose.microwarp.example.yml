# Node engine: MicroWARP (MASQUE over HTTP/3 via usque) — docs/08-masque-nodes.md.
# Device config per node: ./state/warp-<i>/usque/config.json (provision with
# ./register-node.sh <i>); configs hold private keys and stay out of git.
# Generated by ./generate-compose.sh — do not hand-edit.
# Regenerate: ./generate-compose.sh 3 --node-engine=microwarp   (COUNT 1..64, default 10)
# Topology: bridge 10.244.0.0/16, relay app fixed at 10.244.0.100.
# warp-N raw SOCKS5 proxy on 127.0.0.1:<10800+N> (override bind: WARP_BIND),
# relay router (mesh-VPN ingress) on 0.0.0.0:3101-3103 (override bind: INGRESS_BIND).
# Relay app env (RELAY_COUNT, BASE_PORT, RELAY_ALLOWED_TARGETS,
# RELAY_AUTH_TOKEN, LIVE_SIGNALS, LIVE_SIGNAL_FILE) is baked from the
# generation-time environment / .env —
# regenerate after editing either.
# The relay app bind-mounts ./.keep-cold at /signals so its 429 signal file
# lands in the same directory the host keep-cold reads (LIVE_SIGNALS=1).
networks:
  default:
    ipam:
      config:
        - subnet: 10.244.0.0/16

services:
  warp-1:
    image: ghcr.io/ccbkkb/microwarp:latest
    container_name: warp-relay-warp-1
    restart: always
    environment:
      - TUNNEL_PROTOCOL=masque
      - MASQUE_PROXY_MODE=socks
      - BIND_ADDR=0.0.0.0
      - BIND_PORT=1080
      - ALLOW_NO_AUTH=1
      - ENABLE_IPV6=1
      - GOMEMLIMIT=256MiB
    volumes:
      - ./state/warp-1/usque/config.json:/etc/wireguard/masque-config.json:ro
    mem_limit: 48M
    mem_reservation: 16M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    ports:
      - "127.0.0.1:10801:1080"

  warp-2:
    image: ghcr.io/ccbkkb/microwarp:latest
    container_name: warp-relay-warp-2
    restart: always
    environment:
      - TUNNEL_PROTOCOL=masque
      - MASQUE_PROXY_MODE=socks
      - BIND_ADDR=0.0.0.0
      - BIND_PORT=1080
      - ALLOW_NO_AUTH=1
      - ENABLE_IPV6=1
      - GOMEMLIMIT=256MiB
    volumes:
      - ./state/warp-2/usque/config.json:/etc/wireguard/masque-config.json:ro
    mem_limit: 48M
    mem_reservation: 16M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    ports:
      - "127.0.0.1:10802:1080"

  warp-3:
    image: ghcr.io/ccbkkb/microwarp:latest
    container_name: warp-relay-warp-3
    restart: always
    environment:
      - TUNNEL_PROTOCOL=masque
      - MASQUE_PROXY_MODE=socks
      - BIND_ADDR=0.0.0.0
      - BIND_PORT=1080
      - ALLOW_NO_AUTH=1
      - ENABLE_IPV6=1
      - GOMEMLIMIT=256MiB
    volumes:
      - ./state/warp-3/usque/config.json:/etc/wireguard/masque-config.json:ro
    mem_limit: 48M
    mem_reservation: 16M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    ports:
      - "127.0.0.1:10803:1080"

  relay:
    build: .
    container_name: warp-relay-app
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - RELAY_COUNT=3
      - BASE_PORT=3000
      - RELAY_ALLOWED_TARGETS=https://opencode.ai,https://api.kilo.ai,https://oai.endpoints.kepler.ai.cloud.ovh.net
      - RELAY_AUTH_TOKEN=
      - LIVE_SIGNALS=0
      - LIVE_SIGNAL_FILE=/signals/signals.json
    volumes:
      - ./.keep-cold:/signals
    networks:
      default:
        ipv4_address: 10.244.0.100
    ports:
      - "0.0.0.0:3101-3103:3001-3003"
    depends_on:
      - warp-1
      - warp-2
      - warp-3

